<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="100%" height="100%">
  <defs>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="badgeGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 16-point Starburst / Medallion -->
  <g transform="translate(125, 125)" filter="url(#badgeGlow)">
    <!-- Outer Starburst -->
    <path d="M 0,-115 L 22,-85 L 60,-98 L 65,-60 L 98,-60 L 85,-22 L 115,0 L 85,22 L 98,60 L 65,60 L 60,98 L 22,85 L 0,115 L -22,85 L -60,98 L -65,60 L -98,60 L -85,22 L -115,0 L -85,-22 L -98,-60 L -65,-60 L -60,-98 L -22,-85 Z" fill="url(#goldSheen)"/>
    
    <!-- Inner Navy Circle -->
    <circle cx="0" cy="0" r="75" fill="#061A40" stroke="#FFE066" stroke-width="4"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Ribbon & Trophy -->
    <text y="-25" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#FBBF24" text-anchor="middle" letter-spacing="1.5">
      ★ PSAT ★
    </text>
    <text y="-6" font-family="'Poppins', sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">
      SCHOLARSHIP
    </text>
    <text y="14" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FFD166" text-anchor="middle">
      100%
    </text>
    <text y="28" font-family="'Poppins', sans-serif" font-weight="800" font-size="8.5" fill="#90E0EF" text-anchor="middle" letter-spacing="1">
      FEE WAIVER
    </text>
    <text y="44" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#FDE047" text-anchor="middle">
      SESSION 2026-27
    </text>
  </g>
</svg>
