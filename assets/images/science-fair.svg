<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="sciFairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sciFairGrad)"/>
  <polygon points="0,180 400,180 400,250 0,250" fill="#0B1329"/>
  <!-- Science Fair Exhibition Stall -->
  <rect x="60" y="50" width="280" height="130" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <rect x="70" y="60" width="260" height="24" rx="3" fill="#0284C7"/>
  <text x="200" y="76" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">
    INNOVATION &amp; ROBOTICS EXHIBITION
  </text>
  <!-- Solar System Model & Robot Project -->
  <!-- Sun -->
  <circle cx="130" cy="120" r="18" fill="#FBBF24"/>
  <!-- Orbiting Planets -->
  <circle cx="100" cy="110" r="6" fill="#38BDF8"/>
  <circle cx="160" cy="135" r="9" fill="#EF4444"/>
  <ellipse cx="130" cy="120" rx="45" ry="22" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Smart Robot Prototype -->
  <g transform="translate(230, 95)">
    <rect x="0" y="0" width="40" height="35" rx="5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="12" cy="14" r="5" fill="#0284C7"/>
    <circle cx="28" cy="14" r="5" fill="#0284C7"/>
    <line x1="20" y1="0" x2="20" y2="-10" stroke="#EF4444" stroke-width="3"/>
    <circle cx="20" cy="-12" r="3.5" fill="#EF4444"/>
    <rect x="5" y="37" width="30" height="35" rx="3" fill="#64748B"/>
    <rect x="12" y="44" width="16" height="12" rx="2" fill="#34D399"/>
  </g>
  <!-- Badge -->
  <rect x="90" y="205" width="220" height="30" rx="15" fill="#FBBF24"/>
  <text x="200" y="225" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">
    ANNUAL SCIENCE EXHIBITION
  </text>
</svg>
