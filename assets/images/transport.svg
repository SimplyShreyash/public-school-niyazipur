<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgTrans)"/>
  <!-- Road -->
  <polygon points="0,175 400,175 400,250 0,250" fill="#334155"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#FDE047" stroke-width="4" stroke-dasharray="25 15"/>

  <!-- GPS satellite signal waves -->
  <g transform="translate(320, 40)">
    <circle cx="20" cy="20" r="6" fill="#FBBF24"/>
    <path d="M 12,12 A 12,12 0 0,1 28,12" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <path d="M 6,6 A 20,20 0 0,1 34,6" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="20" y="42" font-family="'Poppins', sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="middle">GPS LIVE</text>
  </g>

  <!-- Modern School Bus Profile -->
  <g transform="translate(60, 80)">
    <rect x="0" y="20" width="280" height="90" rx="16" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <!-- Windows -->
    <rect x="18" y="30" width="38" height="34" rx="4" fill="#0284C7"/>
    <rect x="68" y="30" width="38" height="34" rx="4" fill="#0284C7"/>
    <rect x="118" y="30" width="38" height="34" rx="4" fill="#0284C7"/>
    <rect x="168" y="30" width="38" height="34" rx="4" fill="#0284C7"/>
    <rect x="218" y="30" width="48" height="34" rx="4" fill="#0284C7"/>
    <!-- Black Side Stripe & School Name -->
    <rect x="0" y="75" width="280" height="15" fill="#0F172A"/>
    <text x="140" y="86" font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      PUBLIC SCHOOL • NIYAZIPUR - ARJUNPUR
    </text>
    <!-- Headlights & Taillights -->
    <rect x="274" y="94" width="7" height="12" rx="2" fill="#FEF08A"/>
    <rect x="0" y="94" width="6" height="12" rx="2" fill="#EF4444"/>
    <!-- Wheels -->
    <circle cx="60" cy="110" r="22" fill="#0F172A"/>
    <circle cx="60" cy="110" r="9" fill="#94A3B8"/>
    <circle cx="220" cy="110" r="22" fill="#0F172A"/>
    <circle cx="220" cy="110" r="9" fill="#94A3B8"/>
  </g>

  <!-- Badge -->
  <rect x="90" y="205" width="220" height="30" rx="15" fill="#FBBF24"/>
  <text x="200" y="225" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">
    GPS TRACKED SAFE TRANSPORT
  </text>
</svg>
