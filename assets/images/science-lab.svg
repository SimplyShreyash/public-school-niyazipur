<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSci" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgSci)"/>
  <polygon points="0,185 400,185 400,250 0,250" fill="#064E3B"/>
  <!-- Lab Bench -->
  <rect x="50" y="140" width="300" height="45" rx="4" fill="#E2E8F0"/>
  <!-- Microscope -->
  <g transform="translate(110, 80)">
    <rect x="0" y="55" width="45" height="10" rx="3" fill="#1E293B"/>
    <rect x="15" y="25" width="10" height="30" fill="#334155"/>
    <line x1="15" y1="25" x2="35" y2="10" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <rect x="30" y="5" width="12" height="20" rx="2" fill="#94A3B8" transform="rotate(-30 30 5)"/>
    <circle cx="20" cy="50" r="4" fill="#38BDF8"/>
  </g>
  <!-- Flasks & Beakers with colorful liquids -->
  <g transform="translate(200, 95)">
    <!-- Conical Flask -->
    <polygon points="25,5 35,5 50,45 10,45" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <polygon points="27,18 33,18 47,43 13,43" fill="#38BDF8" opacity="0.8"/>
    <!-- Test Tube Stand -->
    <rect x="70" y="25" width="60" height="25" rx="3" fill="#94A3B8"/>
    <rect x="75" y="5" width="10" height="35" rx="5" fill="#EF4444" opacity="0.9"/>
    <rect x="95" y="5" width="10" height="35" rx="5" fill="#FBBF24" opacity="0.9"/>
    <rect x="115" y="5" width="10" height="35" rx="5" fill="#10B981" opacity="0.9"/>
  </g>
  <!-- Chemical Formula / Atom in background -->
  <circle cx="340" cy="65" r="28" fill="none" stroke="#A7F3D0" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="340" cy="65" r="8" fill="#FBBF24"/>
  <!-- Badge -->
  <rect x="110" y="205" width="180" height="30" rx="15" fill="#FBBF24"/>
  <text x="200" y="225" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">
    COMPOSITE SCIENCE LABS
  </text>
</svg>
