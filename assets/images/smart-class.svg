<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSmart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgSmart)"/>
  <!-- Floor -->
  <polygon points="0,190 400,190 400,250 0,250" fill="#0C4A6E"/>
  <!-- Interactive Smart Board -->
  <rect x="70" y="30" width="260" height="135" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <rect x="80" y="40" width="240" height="115" rx="4" fill="#1E293B"/>
  <!-- UI on smart board -->
  <rect x="90" y="50" width="100" height="40" rx="4" fill="#3B82F6" opacity="0.3"/>
  <circle cx="260" cy="70" r="18" fill="#F59E0B" opacity="0.5"/>
  <line x1="95" y1="105" x2="200" y2="105" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="115" x2="170" y2="115" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="125" x2="220" y2="125" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="260,100 280,135 240,135" fill="#10B981" opacity="0.6"/>
  <!-- Teacher & Student Desks -->
  <rect x="40" y="170" width="80" height="25" rx="3" fill="#BAE6FD"/>
  <rect x="280" y="170" width="80" height="25" rx="3" fill="#BAE6FD"/>
  <rect x="160" y="175" width="80" height="25" rx="3" fill="#BAE6FD"/>
  <!-- Badge -->
  <rect x="110" y="205" width="180" height="30" rx="15" fill="#FBBF24"/>
  <text x="200" y="225" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">
    DIGITAL SMART CLASSROOM
  </text>
</svg>
