<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="340" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.35">
    <ellipse cx="120" cy="80" rx="60" ry="22"/>
    <ellipse cx="160" cy="70" rx="40" ry="25"/>
    <ellipse cx="650" cy="95" rx="75" ry="26"/>
    <ellipse cx="700" cy="85" rx="50" ry="28"/>
  </g>

  <!-- Twinkling stars in sky -->
  <g fill="#FDE047" opacity="0.85">
    <polygon points="280,45 282,50 287,50 283,53 285,58 280,55 275,58 277,53 273,50 278,50" />
    <polygon points="520,35 522,40 527,40 523,43 525,48 520,45 515,48 517,43 513,40 518,40" />
    <polygon points="90,130 91,134 95,134 92,136 93,140 90,138 87,140 88,136 85,134 89,134" />
    <polygon points="730,140 731,144 735,144 732,146 733,150 730,148 727,150 728,146 725,144 729,144" />
  </g>

  <!-- Modern Multi-Story School Complex -->
  <!-- Left Wing -->
  <g filter="url(#softShadow)">
    <rect x="120" y="160" width="180" height="170" rx="4" fill="url(#bldgGrad)"/>
    <!-- Left Wing Windows -->
    <rect x="140" y="180" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="185" y="180" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="230" y="180" width="30" height="25" rx="2" fill="#0284C7"/>

    <rect x="140" y="225" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="185" y="225" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="230" y="225" width="30" height="25" rx="2" fill="#0284C7"/>

    <rect x="140" y="270" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="185" y="270" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="230" y="270" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="120" y="150" width="180" height="12" fill="#1E3A8A"/>
  </g>

  <!-- Right Wing -->
  <g filter="url(#softShadow)">
    <rect x="500" y="160" width="180" height="170" rx="4" fill="url(#bldgGrad)"/>
    <!-- Right Wing Windows -->
    <rect x="520" y="180" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="565" y="180" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="610" y="180" width="30" height="25" rx="2" fill="#0284C7"/>

    <rect x="520" y="225" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="565" y="225" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="610" y="225" width="30" height="25" rx="2" fill="#0284C7"/>

    <rect x="520" y="270" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="565" y="270" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="610" y="270" width="30" height="25" rx="2" fill="#0284C7"/>
    <rect x="500" y="150" width="180" height="12" fill="#1E3A8A"/>
  </g>

  <!-- Main Center Tower & Grand Entrance -->
  <g filter="url(#softShadow)">
    <rect x="280" y="110" width="240" height="220" rx="6" fill="#FFFFFF"/>
    
    <!-- Grand Pediment / Triangular Dome Roof -->
    <polygon points="270,110 400,45 530,110" fill="url(#roofGrad)"/>
    <circle cx="400" cy="85" r="16" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
    <!-- Clock in tower -->
    <line x1="400" y1="85" x2="400" y2="76" stroke="#1E293B" stroke-width="2"/>
    <line x1="400" y1="85" x2="407" y2="85" stroke="#1E293B" stroke-width="2"/>

    <!-- School Name Banner on Building -->
    <rect x="295" y="120" width="210" height="28" rx="4" fill="#0A192F"/>
    <text x="400" y="139" font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" fill="#FBBF24" text-anchor="middle" letter-spacing="1">
      PUBLIC SCHOOL NIYAZIPUR
    </text>

    <!-- Center Wing Windows / Smart Labs -->
    <rect x="315" y="165" width="45" height="32" rx="3" fill="#38BDF8"/>
    <rect x="378" y="165" width="45" height="32" rx="3" fill="#38BDF8"/>
    <rect x="440" y="165" width="45" height="32" rx="3" fill="#38BDF8"/>

    <rect x="315" y="215" width="45" height="32" rx="3" fill="#38BDF8"/>
    <rect x="378" y="215" width="45" height="32" rx="3" fill="#38BDF8"/>
    <rect x="440" y="215" width="45" height="32" rx="3" fill="#38BDF8"/>

    <!-- Grand Entrance Pillars & Glass Doors -->
    <rect x="330" y="270" width="12" height="60" fill="#E2E8F0"/>
    <rect x="458" y="270" width="12" height="60" fill="#E2E8F0"/>
    <rect x="350" y="275" width="100" height="55" rx="4" fill="#0F172A"/>
    <rect x="355" y="280" width="42" height="50" rx="2" fill="#38BDF8" opacity="0.8"/>
    <rect x="403" y="280" width="42" height="50" rx="2" fill="#38BDF8" opacity="0.8"/>
    <!-- Indian National Tricolor Flag on Flagpole -->
    <line x1="400" y1="45" x2="400" y2="12" stroke="#64748B" stroke-width="3"/>
    <rect x="401" y="14" width="30" height="6" fill="#FF9933"/>
    <rect x="401" y="20" width="30" height="6" fill="#FFFFFF"/>
    <circle cx="416" cy="23" r="2.5" fill="#000080"/>
    <rect x="401" y="26" width="30" height="6" fill="#128807"/>
  </g>

  <!-- Green Lawn & Sports Ground -->
  <rect y="330" width="800" height="170" fill="url(#groundGrad)"/>
  
  <!-- Running Track curve -->
  <path d="M 0,420 Q 400,360 800,420 L 800,500 L 0,500 Z" fill="url(#trackGrad)"/>
  <path d="M 0,435 Q 400,375 800,435" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="12 8"/>
  <path d="M 0,465 Q 400,405 800,465" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="12 8"/>

  <!-- Yellow School Bus -->
  <g transform="translate(60, 310)" filter="url(#softShadow)">
    <rect x="0" y="15" width="150" height="55" rx="10" fill="#FBBF24"/>
    <rect x="10" y="22" width="24" height="20" rx="3" fill="#0284C7"/>
    <rect x="40" y="22" width="24" height="20" rx="3" fill="#0284C7"/>
    <rect x="70" y="22" width="24" height="20" rx="3" fill="#0284C7"/>
    <rect x="100" y="22" width="38" height="20" rx="3" fill="#0284C7"/>
    <!-- Bus stripe & text -->
    <rect x="0" y="47" width="150" height="8" fill="#1E293B"/>
    <text x="65" y="54" font-family="'Poppins', sans-serif" font-weight="700" font-size="6.5" fill="#FFFFFF">
      PUBLIC SCHOOL BUS
    </text>
    <!-- Bus wheels -->
    <circle cx="35" cy="70" r="14" fill="#1E293B"/>
    <circle cx="35" cy="70" r="6" fill="#94A3B8"/>
    <circle cx="115" cy="70" r="14" fill="#1E293B"/>
    <circle cx="115" cy="70" r="6" fill="#94A3B8"/>
  </g>

  <!-- Happy Students Illustrative Silhouettes -->
  <g transform="translate(640, 315)">
    <!-- Student 1 (Girl with backpack) -->
    <circle cx="20" cy="15" r="9" fill="#F8D7B8"/>
    <path d="M 12,24 C 10,40 10,60 10,75 L 18,75 L 20,48 L 22,75 L 30,75 C 30,60 30,40 28,24 Z" fill="#2563EB"/>
    <!-- Skirt -->
    <polygon points="12,42 28,42 34,60 6,60" fill="#1E3A8A"/>
    <!-- Backpack -->
    <rect x="4" y="26" width="9" height="22" rx="3" fill="#EF4444"/>

    <!-- Student 2 (Boy with books) -->
    <circle cx="60" cy="13" r="9" fill="#F8D7B8"/>
    <rect x="50" y="22" width="20" height="30" rx="4" fill="#FFFFFF"/>
    <rect x="52" y="50" width="8" height="25" fill="#1E3A8A"/>
    <rect x="62" y="50" width="8" height="25" fill="#1E3A8A"/>
    <!-- Books in arm -->
    <rect x="42" y="32" width="12" height="15" rx="2" fill="#F59E0B" transform="rotate(-15 42 32)"/>
  </g>

  <!-- Flying graduation caps in sky -->
  <g transform="translate(210, 60)" fill="#0F172A">
    <polygon points="15,0 30,7 15,14 0,7"/>
    <rect x="9" y="10" width="12" height="7" rx="1"/>
    <path d="M 30,7 L 34,18" stroke="#F59E0B" stroke-width="1.5"/>
  </g>
  <g transform="translate(580, 50)" fill="#0F172A">
    <polygon points="12,0 24,6 12,12 0,6"/>
    <rect x="7" y="8" width="10" height="6" rx="1"/>
    <path d="M 24,6 L 27,15" stroke="#F59E0B" stroke-width="1.5"/>
  </g>
</svg>
