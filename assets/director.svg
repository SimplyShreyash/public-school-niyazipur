<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="450" rx="24" fill="url(#bgGrad)" filter="url(#softGlow)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="350" cy="80" r="120" fill="#F59E0B" opacity="0.1"/>
  <circle cx="50" cy="380" r="140" fill="#3B82F6" opacity="0.1"/>

  <!-- Director / Administrator Silhouette & Portrait Artwork -->
  <!-- Outer Aura Ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#goldAccent)" stroke-width="4" stroke-dasharray="8 4"/>
  <circle cx="200" cy="180" r="100" fill="#1E293B"/>

  <!-- Suit & Shoulders -->
  <g transform="translate(200, 180)">
    <!-- Shoulders / Blazer -->
    <path d="M -85,100 C -70,50 -40,30 0,35 C 40,30 70,50 85,100 Z" fill="#0A192F"/>
    <!-- Collar & Shirt -->
    <polygon points="-25,40 0,75 25,40 15,35 0,42 -15,35" fill="#FFFFFF"/>
    <!-- Tie -->
    <polygon points="-6,48 6,48 9,90 0,105 -9,90" fill="#DC2626"/>
    <!-- Blazer Lapels -->
    <path d="M -25,40 L -45,75 L -10,100 L -2,55 Z" fill="#172554"/>
    <path d="M 25,40 L 45,75 L 10,100 L 2,55 Z" fill="#172554"/>
    
    <!-- Head / Neck -->
    <rect x="-14" y="20" width="28" height="24" rx="4" fill="#F5D0B1"/>
    <!-- Face -->
    <ellipse cx="0" cy="5" rx="35" ry="42" fill="#F8D7B8"/>
    <!-- Hair -->
    <path d="M -36,-5 C -35,-35 -15,-45 0,-45 C 18,-45 35,-35 36,-5 C 32,-15 15,-28 0,-25 C -15,-28 -32,-15 -36,-5 Z" fill="#1E293B"/>
    <!-- Professional Glasses -->
    <rect x="-26" y="-2" width="20" height="14" rx="3" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <rect x="6" y="-2" width="20" height="14" rx="3" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <line x1="-6" y1="5" x2="6" y2="5" stroke="#D97706" stroke-width="2.5"/>
    <!-- Gentle Smile -->
    <path d="M -10,25 Q 0,33 10,25" fill="none" stroke="#9A3412" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Name & Title Badge -->
  <g transform="translate(200, 340)">
    <rect x="-160" y="0" width="320" height="85" rx="14" fill="#0B132B" stroke="url(#goldAccent)" stroke-width="2"/>
    <text y="30" font-family="'Montserrat', sans-serif" font-weight="800" font-size="19" fill="#FFFFFF" text-anchor="middle">
      Shri Ajit Kumar Thakur
    </text>
    <text y="52" font-family="'Poppins', sans-serif" font-weight="600" font-size="12.5" fill="#F59E0B" text-anchor="middle" letter-spacing="1.2">
      FOUNDER &amp; ADMINISTRATOR
    </text>
    <text y="70" font-family="'Poppins', sans-serif" font-weight="400" font-size="11" fill="#94A3B8" text-anchor="middle">
      Public School, Niyazipur, Arjunpur
    </text>
  </g>

  <!-- Star accents -->
  <polygon points="50,40 52,45 57,45 53,48 55,53 50,50 45,53 47,48 43,45 48,45" fill="#FDE047"/>
  <polygon points="340,320 342,325 347,325 343,328 345,333 340,330 335,333 337,328 333,325 338,325" fill="#FDE047"/>
</svg>
